name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: fmt / clippy / check / test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Reads channel, components, and the wasm32 target from rust-toolchain.toml.
      # Caching (Swatinem/rust-cache) is enabled by default.
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo check
        run: cargo check --workspace

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build --target wasm32-unknown-unknown (yoke-config)
        run: cargo build -p yoke-config --target wasm32-unknown-unknown

      - name: cargo build --target wasm32-unknown-unknown (yoke-edit)
        run: cargo build -p yoke-edit --target wasm32-unknown-unknown

      - name: cargo build (yoke-gui native)
        run: cargo build -p yoke-gui

      - name: cargo test (yoke-gui host)
        run: cargo test -p yoke-gui

      - name: cargo build --target wasm32-unknown-unknown (yoke-gui)
        run: cargo build -p yoke-gui --target wasm32-unknown-unknown

      - name: verify completions generate
        run: |
          for shell in bash zsh fish powershell elvish; do
            cargo run -p yokectl -- completions "$shell" > /dev/null
          done

      - name: verify docs generate (man + markdown)
        run: |
          mkdir -p target/ci-docs
          cargo run --quiet -p yokectl -- docs --format man --out target/ci-docs
          cargo run --quiet -p yokectl -- docs --format md  --out target/ci-docs
          test -s target/ci-docs/man/yokectl.1
          test -s target/ci-docs/markdown/yokectl.md

      # Main-only: PRs from forks/contributors should not trigger live network
      # access without consent, and Google Sheets uptime is the only thing that
      # can flake this step.
      - name: real-network community-index smoke
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: cargo test -p yoke-index --test integration -- --ignored --nocapture real_community_index_fetches
