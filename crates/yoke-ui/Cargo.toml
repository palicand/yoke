[package]
name = "yoke-ui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Yoke Leptos WASM frontend."

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1.7"
futures = "0.3.31"
js-sys = "0.3.72"
leptos = { version = "0.7", features = ["csr"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
tracing = "0.1.44"
tracing-wasm = "0.2.1"
wasm-bindgen = "0.2.95"
wasm-bindgen-futures = "0.4.45"
yoke-config = { version = "0.1.0", path = "../yoke-config" }
yoke-ipc = { version = "0.1.0", path = "../yoke-ipc" }

[dependencies.web-sys]
version = "0.3.72"
features = ["Window"]

[dev-dependencies]
wasm-bindgen-test = "0.3.45"
