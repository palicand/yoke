[package]
name = "yoke-volume"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "QuadStick FAT-volume discovery, listing, and atomic profile I/O."

[lints]
workspace = true

[features]
test-utils = []

[dependencies]
rand = { version = "0.10.1", features = ["std_rng"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["sync", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
serde_json = "1.0.149"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["rt", "time"] }
yoke-config = { path = "../yoke-config" }
