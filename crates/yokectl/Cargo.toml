[package]
name = "yokectl"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Command-line surface for the QuadStick (volume, config, install)."

[lints]
workspace = true

[[bin]]
name = "yokectl"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
yoke-volume-macos = { path = "../yoke-volume-macos" }

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.5"
clap_mangen = "0.3.0"
console = "0.16.3"
is-terminal = "0.4.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["rt", "macros", "sync", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
yoke-config = { version = "0.1.0", path = "../yoke-config" }
yoke-edit = { version = "0.1.0", path = "../yoke-edit" }
yoke-index = { version = "0.1.0", path = "../yoke-index" }
yoke-volume = { version = "0.1.0", path = "../yoke-volume" }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.47.2", features = ["json"] }
predicates = "3.1.4"
tempfile = "3.27.0"
wiremock = "0.6.5"
yoke-volume = { path = "../yoke-volume", features = ["test-utils"] }
