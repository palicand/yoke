[package]
name = "yoke-config"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "QuadStick configuration CSV parser, serializer, and vocabulary catalog."

[lints]
workspace = true

[dependencies]
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"

[dev-dependencies]
pretty_assertions = "1.4.1"
serde_json = "1.0.149"
walkdir = "2.5.0"
