[package]
name = "yoke-gui"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Configuration GUI for the QuadStick adaptive controller (egui)."

# cdylib is the wasm artifact trunk bundles (carries the #[wasm_bindgen(start)]
# entry + web-sys imports); rlib lets the native bin and tests `use yoke_gui::`.
[lib]
name = "yoke_gui"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "yoke-gui"
path = "src/main.rs"

[dependencies]
egui = "0.34"
thiserror = "2"
tracing = "0.1"
yoke-config = { version = "0.1.0", path = "../yoke-config" }
yoke-edit = { version = "0.1.0", path = "../yoke-edit" }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
eframe = { version = "0.34", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
rfd = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tracing-subscriber = "0.3"
url = "2"
yoke-index = { version = "0.1.0", path = "../yoke-index" }
yoke-volume = { version = "0.1.0", path = "../yoke-volume" }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "macos"))'.dependencies]
yoke-volume-macos = { version = "0.1.0", path = "../yoke-volume-macos" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
eframe = { version = "0.34", default-features = false, features = ["glow", "default_fonts"] }
tracing-wasm = "0.2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Document"] }

[target.'cfg(all(not(target_arch = "wasm32"), target_os = "windows"))'.dependencies]
yoke-volume-windows = { version = "0.1.0", path = "../yoke-volume-windows" }

[dev-dependencies]
tempfile = "3"
yoke-volume = { path = "../yoke-volume", features = ["test-utils"] }

# cargo-packager bundle config. `cargo packager` reads this; ordinary cargo
# builds ignore it. `signing-identity` is intentionally absent: a plain
# `cargo packager` produces an unsigned bundle (fine for local smoke tests),
# and the release workflow injects the identity from the APPLE_SIGNING_IDENTITY
# secret so no Apple-account specifics live in tracked files. See docs/RELEASING.md.
[package.metadata.packager]
product-name = "Yoke"
identifier = "com.github.palicand.yoke"
category = "public.app-category.utilities"
description = "Configuration software for the QuadStick adaptive controller."
homepage = "https://github.com/palicand/yoke"
# A real .icns is used directly; a lone PNG fails cargo-packager's ICNS size
# matching. Add icon.ico here when the Windows leg lands.
icons = ["assets/icons/icon.icns"]
binaries = [{ path = "yoke-gui", main = true }]
formats = ["dmg"]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
